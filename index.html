<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주40시간 유연근무 트래커</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#fbfaf7; --ink:#1d2433; --muted:#6b7280; --line:#d9d6cf; --line-soft:#ecebe6;
    --head:#eef1f5; --over:#0f766e; --over-bg:#e6f4f1; --under:#b4412c; --under-bg:#fbeae6; --ok:#2563eb; --ok-bg:#e8eef7;
    --accent:#2b4c7e; --accent-soft:#e8eef7; --input:#fffef9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;padding:24px 28px 14px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  .note{color:var(--muted);font-size:12.5px;margin-top:4px}
  .month{display:flex;align-items:center;gap:8px}
  .month button{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:30px;cursor:pointer;font-size:15px}
  .month input[type=month]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:15px;font-weight:600;background:#fff}
  .summary{margin-left:auto;display:flex;gap:22px}
  .summary div{text-align:right}
  .summary .lbl{font-size:12px;color:var(--muted)}
  .summary .val{font-size:20px;font-weight:700}
  .summary .val.over{color:var(--over)} .summary .val.under{color:var(--under)}
  main{padding:14px 28px 40px;overflow-x:auto}
  table{border-collapse:collapse;min-width:820px;width:100%;background:#fff;border:1px solid var(--line)}
  th,td{border:1px solid var(--line-soft);padding:0;height:36px;text-align:center;white-space:nowrap}
  thead th{background:var(--head);font-weight:600;font-size:13px;height:34px;border-bottom:1px solid var(--line)}
  th.week{background:var(--accent-soft);color:var(--accent);font-weight:700;width:76px;vertical-align:middle;border-right:1px solid var(--line)}
  td.date{width:110px;color:var(--ink)}
  td.date.today{font-weight:700;color:var(--accent)}
  td.date .dow{color:var(--muted);margin-left:3px}
  td.date .dow.sat{color:#2563eb} td.date .dow.sun{color:#dc2626}
  td.time{width:118px;position:relative}
  td.time input{width:100%;height:36px;border:0;background:var(--input);text-align:center;font:inherit;font-size:14px;color:var(--ink);outline:none;padding:0 26px 0 6px}
  td.time input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  td.time .now{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer;padding:3px 4px;border-radius:4px;opacity:0}
  td.time:hover .now,td.time input:focus+.now{opacity:1}
  td.time .now:hover{background:var(--accent-soft);color:var(--accent)}
  td.brk input,td.std input{width:100%;height:36px;border:0;background:transparent;text-align:center;font:inherit;color:var(--ink);outline:none}
  td.brk input:focus,td.std input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  td.calc{width:96px;font-weight:600}
  td.diff{width:96px;font-weight:700}
  td.diff.over{color:var(--over);background:var(--over-bg)} td.diff.under{color:var(--under);background:var(--under-bg)}
  td.diff.zero{color:var(--muted)}
  td.memo input{width:100%;height:36px;border:0;background:transparent;font:inherit;color:var(--ink);padding:0 8px;outline:none;text-align:left}
  td.memo input:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--accent)}
  tr.total td{background:var(--head);font-weight:700;height:34px;border-top:1px solid var(--line);border-bottom:2px solid var(--line)}
  tr.total td.diff.over{background:var(--over-bg)} tr.total td.diff.under{background:var(--under-bg)}
  tr.total td.diff.ok{color:var(--ok);background:var(--ok-bg)}
  tr.total td:first-child{text-align:right;padding-right:10px;color:var(--muted);font-weight:600}
  .hint{margin-top:10px;font-size:12px;color:var(--muted)}
  .saved{margin-left:12px;font-size:12px;color:var(--muted)}
  .auth{display:flex;align-items:center;gap:8px;font-size:13px}
  .auth input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;width:200px}
  .auth button{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
  .auth button.ghost{background:#fff;color:var(--accent)}
  .auth .who{color:var(--muted)}
  @media (max-width:640px){header,main{padding-left:12px;padding-right:12px}.summary{margin-left:0}}
</style>
</head>
<body>
<header>
  <div>
    <h1>주40시간 유연근무 트래커</h1>
    <div class="note">휴게시간 1시간은 자동으로 빠져요 · 주간 합계가 37:30~38:00 안이면 파란색, 벗어나면 빨간색으로 표시돼요</div>
  </div>
  <div class="month">
    <button id="prev" title="이전 달">‹</button>
    <input type="month" id="month">
    <button id="next" title="다음 달">›</button>
    <span class="saved" id="saved"></span>
  </div>
  <div class="auth" id="auth">
    <input type="email" id="email" placeholder="이메일 → 로그인 링크 받기">
    <button id="login">로그인 링크 보내기</button>
  </div>
  <div class="summary">
    <div><div class="lbl">이번 달 근로시간</div><div class="val" id="sumWork">0:00</div></div>
    <div><div class="lbl">기준 근로시간</div><div class="val" id="sumStd">0:00</div></div>
    <div><div class="lbl">기준 대비</div><div class="val" id="sumDiff">-</div></div>
  </div>
</header>
<main>
  <table>
    <thead><tr>
      <th></th><th>일자</th><th>시작시간</th><th>종료시간</th><th>근로시간</th><th>기준</th><th>기준 대비</th><th>비고</th>
    </tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div class="hint">시작·종료 칸에 마우스를 올리면 나오는 <b>지금</b> 버튼으로 현재 시각을 바로 넣을 수 있어요. 값은 입력 즉시 저장됩니다.</div>
</main>
<script>
const STD_DEFAULT = '07:30';
const BREAK_MIN = 60;      // 휴게시간(분) — 항상 차감
const WEEK_TOL = 30;       // 주간 허용 초과(분): 기준(37:30) ~ 기준+30분(38:00) 이면 정상(파랑), 벗어나면 빨강
const DOW = ['일','월','화','수','목','금','토'];
let monthKey = '';           // "2026-09"
let data = {};               // { "2026-09-01": {s,e,b,std,m} }

// ---------- storage: Supabase ----------
// ★ 본인 프로젝트 값으로 바꾸세요 (Supabase → Project Settings → API)
const SUPABASE_URL  = 'https://YOUR-PROJECT.supabase.co';
const SUPABASE_ANON = 'YOUR-ANON-PUBLIC-KEY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let user = null;
let memoryStore = {};        // 로그인 전 임시 저장

async function load(key){
  if(!user) return memoryStore[key] || {};
  const {data:row, error} = await sb.from('work_log').select('data').eq('month', key).maybeSingle();
  if(error){ flash('불러오기 실패: '+error.message); return memoryStore[key]||{}; }
  return row ? row.data : {};
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    memoryStore[monthKey]=data;
    if(!user){ flash('로그인하면 서버에 저장돼요'); return; }
    const {error} = await sb.from('work_log').upsert(
      {user_id:user.id, month:monthKey, data, updated_at:new Date().toISOString()},
      {onConflict:'user_id,month'});
    flash(error ? '저장 실패: '+error.message : '서버에 저장됨');
  },400);
}
function flash(t){ const s=document.getElementById('saved'); s.textContent=t; setTimeout(()=>s.textContent='',2000); }

// ---------- auth: 매직링크 ----------
function renderAuth(){
  const a=document.getElementById('auth');
  a.innerHTML = user
    ? `<span class="who">${user.email}</span><button class="ghost" id="logout">로그아웃</button>`
    : `<input type="email" id="email" placeholder="이메일 → 로그인 링크 받기"><button id="login">로그인 링크 보내기</button>`;
  if(user) document.getElementById('logout').onclick=async()=>{ await sb.auth.signOut(); };
  else document.getElementById('login').onclick=async()=>{
    const email=document.getElementById('email').value.trim(); if(!email) return;
    const {error}=await sb.auth.signInWithOtp({email, options:{emailRedirectTo:location.href.split('#')[0]}});
    flash(error ? '전송 실패: '+error.message : '메일함에서 링크를 눌러 주세요');
  };
}
sb.auth.onAuthStateChange(async(_e, session)=>{
  user = session?.user || null; renderAuth();
  if(monthKey){ data = await load(monthKey); render(); }
});

// ---------- time helpers ----------
const toMin = t => { if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; };
const fmt = m => { const sign=m<0?'-':''; m=Math.abs(m); return sign+Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); };
const pad2 = n => String(n).padStart(2,'0');
const nowHM = () => { const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
const iso = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());


function calcRow(r){
  const s=toMin(r.s), e=toMin(r.e);
  if(s==null||e==null) return {work:null, brk:null, std:toMin(r.std||STD_DEFAULT)};
  let gross=e-s; if(gross<0) gross+=1440;          // 자정 넘김 처리 (엑셀의 IF(E<D,1,0)와 동일)
  const brk = BREAK_MIN;                             // 휴게 1시간 고정
  return {work:Math.max(0,gross-brk), brk, std:toMin(r.std||STD_DEFAULT)};
}

// ---------- month → weeks (엑셀 규칙: 1일이 포함된 주의 월요일부터 5주) ----------
function weeksOf(key){
  const [y,m]=key.split('-').map(Number);
  const first=new Date(y,m-1,1);
  const mon=new Date(first); mon.setDate(first.getDate()-((first.getDay()+6)%7));
  const weeks=[];
  for(let w=0;w<5;w++){
    const days=[];
    for(let d=0;d<5;d++){ const dt=new Date(mon); dt.setDate(mon.getDate()+w*7+d); days.push(dt); }
    weeks.push(days);
  }
  return {weeks, month:m};
}

// ---------- render ----------
function render(){
  const {weeks, month}=weeksOf(monthKey);
  const body=document.getElementById('body'); body.innerHTML='';
  const today=iso(new Date());
  let mWork=0,mStd=0;
  weeks.forEach((days,wi)=>{
    let wWork=0,wStd=0;
    days.forEach((dt,di)=>{
      const k=iso(dt); const r=data[k]||(data[k]={});
      const c=calcRow(r);
      const tr=document.createElement('tr'); tr.dataset.k=k;
      if(di===0){ const th=document.createElement('th'); th.className='week'; th.rowSpan=5; th.textContent=`${month}월 ${wi+1}주`; tr.appendChild(th); }
      const dow=dt.getDay();
      tr.innerHTML+=`<td class="date${k===today?' today':''}">${pad2(dt.getMonth()+1)}/${pad2(dt.getDate())}<span class="dow">(${DOW[dow]})</span></td>`;
      tr.innerHTML+=`<td class="time"><input type="time" data-k="${k}" data-f="s" value="${r.s||''}"><button class="now" data-k="${k}" data-f="s">지금</button></td>`;
      tr.innerHTML+=`<td class="time"><input type="time" data-k="${k}" data-f="e" value="${r.e||''}"><button class="now" data-k="${k}" data-f="e">지금</button></td>`;
      tr.innerHTML+=`<td class="calc">${c.work!=null?fmt(c.work):''}</td>`;
      tr.innerHTML+=`<td class="std"><input type="time" data-k="${k}" data-f="std" value="${r.std||STD_DEFAULT}"></td>`;
      tr.innerHTML+=diffCell(c.work,c.std);
      tr.innerHTML+=`<td class="memo"><input type="text" data-k="${k}" data-f="m" value="${(r.m||'').replace(/"/g,'&quot;')}" placeholder=""></td>`;
      body.appendChild(tr);
      if(c.work!=null){ wWork+=c.work; } wStd+=c.std;
    });
    const tr=document.createElement('tr'); tr.className='total'; tr.dataset.w=wi;
    tr.innerHTML=`<td colspan="4">주간 합계</td><td class="calc">${fmt(wWork)}</td><td class="stdsum">${fmt(wStd)}</td>${diffCell(wWork,wStd,true)}<td></td>`;
    body.appendChild(tr);
    mWork+=wWork; if(wWork>0) mStd+=wStd;
  });
  document.getElementById('sumWork').textContent=fmt(mWork);
  document.getElementById('sumStd').textContent=fmt(mStd);
  const sd=document.getElementById('sumDiff'); const d=mWork-mStd;
  sd.textContent=(d>0?'+':d<0?'-':'')+fmt(Math.abs(d)); sd.className='val '+(d>0?'over':d<0?'under':'');
}
function diffCell(work,std,total){
  if(work==null && !total) return `<td class="diff"></td>`;
  const d=(work||0)-std;
  const cls = total ? ((d<0||d>WEEK_TOL)?'under':'ok') : (d>0?'over':d<0?'under':'zero');
  return `<td class="diff ${cls}">${d>0?'+':d<0?'-':'±'}${fmt(Math.abs(d))}</td>`;
}

// ---------- events ----------
document.getElementById('body').addEventListener('input',e=>{
  const el=e.target; if(!el.dataset.k) return;
  const r=data[el.dataset.k]||(data[el.dataset.k]={});
  r[el.dataset.f]=el.value;
  save();
  if(el.dataset.f!=='m') refreshCalc();   // 입력칸은 그대로 두고 숫자만 갱신 (타이핑 중 끊김 방지)
});
// 입력 요소를 새로 만들지 않고 근로시간·기준대비·합계만 다시 계산
function refreshCalc(){
  const {weeks}=weeksOf(monthKey);
  let mWork=0,mStd=0;
  weeks.forEach((days,wi)=>{
    let wWork=0,wStd=0;
    days.forEach(dt=>{
      const k=iso(dt); const r=data[k]||{}; const c=calcRow(r);
      const tr=document.querySelector(`tr[data-k="${k}"]`); if(!tr) return;
      tr.querySelector('td.calc').textContent=c.work!=null?fmt(c.work):'';
      tr.querySelector('td.diff').outerHTML=diffCell(c.work,c.std);
      if(c.work!=null){ wWork+=c.work; } wStd+=c.std;
    });
    const tt=document.querySelector(`tr.total[data-w="${wi}"]`);
    if(tt){ tt.querySelector('td.calc').textContent=fmt(wWork); tt.querySelector('td.stdsum').textContent=fmt(wStd); tt.querySelector('td.diff').outerHTML=diffCell(wWork,wStd,true); }
    mWork+=wWork; if(wWork>0) mStd+=wStd;
  });
  document.getElementById('sumWork').textContent=fmt(mWork);
  document.getElementById('sumStd').textContent=fmt(mStd);
  const sd=document.getElementById('sumDiff'); const d=mWork-mStd;
  sd.textContent=(d>0?'+':d<0?'-':'')+fmt(Math.abs(d)); sd.className='val '+(d>0?'over':d<0?'under':'');
}
document.getElementById('body').addEventListener('click',e=>{
  const b=e.target.closest('button.now'); if(!b) return;
  const r=data[b.dataset.k]||(data[b.dataset.k]={}); r[b.dataset.f]=nowHM(); save(); render();
});
async function setMonth(key){
  monthKey=key; document.getElementById('month').value=key;
  data=await load(key); render();
}
document.getElementById('month').addEventListener('change',e=>{ if(e.target.value) setMonth(e.target.value); });
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
function shift(n){ const [y,m]=monthKey.split('-').map(Number); const d=new Date(y,m-1+n,1); setMonth(d.getFullYear()+'-'+pad2(d.getMonth()+1)); }

const t=new Date(); setMonth(t.getFullYear()+'-'+pad2(t.getMonth()+1));
</script>
</body>
</html>
